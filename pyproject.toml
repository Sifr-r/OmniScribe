[project]
name = "omniscribe"
# Bumped to 0.3.0 at the v0.3.0 release (2026-09-06) — the single-binary
# Windows distribution ships. The version was stale at "0.1.0" through
# v0.2.0 because the field was not part of the release checklist; the
# v0.3.0 commit fixes that. setuptools_scm is NOT used (the version is
# hand-maintained so a tag is independent of the source bump).
version = "0.3.0"
description = "Transform scanned and written documents into fully searchable, selectable PDFs using the power of Local LLM Vision"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ahnaf An Nafee", email = "ahnafnafee@gmail.com" },
]
keywords = ["ocr", "pdf", "vision", "llm", "olmocr", "surya", "omniscribe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=2.11.0,<3",
    "pillow>=11.3",
    "pymupdf>=1.26.7,<2",  # AGPL-3.0; see THIRD_PARTY_LICENSES.md
    "python-dotenv>=1.2.1",
    "tqdm>=4.70.0",
    "surya-ocr>=0.22.1",
    # Bounded majors (audit backlog): a torch 3.x or torchvision 1.x
    # release could break surya's model layer without warning.
    "torch>=2.0.0,<3",
    "torchvision>=0.15.0,<1",
    "httpx>=0.28.1",
    # `requests` is intentionally NOT a base dep: surya-ocr ≥ 0.22
    # declares `requests<3,>=2.28.0` itself, so the runtime tree
    # pulls it in transitively. The only direct importer in this
    # repo is `scripts/ingest_lexicon.py` (a dev-only ingestion
    # helper), which is satisfied by the `requests` entry in
    # [dependency-groups] `dev` below.
    "pyspellchecker>=0.8.1",
    "python-docx>=1.1.0",
    "redis>=8.1.0",
    "numpy>=2.0,<2.5.0",
    "defusedxml>=0.7.1",  # XLIFF/TBX/TMX glossary parsing without XXE/DTD
    # Cordis-style harness: RuntimeSettings (pydantic-settings), plugin
    # Schemas (pydantic), and cordis.yml parsing (pyyaml) are direct
    # imports — declared here instead of relying on transitive edges.
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "websockets>=17.0.1,<18.0",
    # Phase 4.4 (2026-09-05, re-resolved 2026-09-05): pin anyio to the
    # 3.x line. anyio 4.x uses ``_lazyimport`` for submodules, which
    # PyInstaller's static analysis cannot trace — the resulting
    # onefile bundle ships with ``anyio/__init__.py`` only and fails
    # on the first ``import anyio.abc`` at runtime. anyio 3.x uses
    # normal imports and is the LTS line; for a v0.2.0 hobbyist
    # bundle the trade-off (no 4.x perf wins) is acceptable.
    # See ``docs/deployment/windows-bundle.md`` §"Known build issue".
    "anyio>=3.7,<4",
    "python-multipart>=0.0.20",
]
preprocessing = [
    "opencv-python-headless>=4.8.0",
    # numpy lives in the base deps (>=2.0,<2.5.0) — no duplicate here.
]
# Async translation: the LLM-driven translation workflow. ``chromadb`` and
# ``sentence-transformers`` are intentionally kept out so this extra is
# light (no torch / torch-multiprocessing). Install ``memory`` alongside
# for the lexicon-backed RAG feature; the translation module degrades
# gracefully when the lexicon store is unavailable.
async-translation = [
    # redis is a base dep — no duplicate here.
    "langgraph>=0.1.0",
]
memory = [
    # DEPRECATED: alias for the `lexicon` extra. The LanceDB migration
    # (see `docs/lexicon-migration-spec.md` §10) renames this extra. Kept
    # as a one-release compatibility shim so existing `omniscribe[memory]`
    # installs keep working. The `chromadb` dependency was removed in
    # Phase 5; if you have a `chroma_db/` directory on disk, the migration
    # CLI will back it up but no longer read it.
    "lancedb>=0.5.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "sentence-transformers>=6.0.0",
]
# Canonical lexicon store (LanceDB). Replaces the legacy `[memory]`
# ChromaDB-backed extra. Install with `uv sync --extra lexicon`.
lexicon = [
    "lancedb>=0.5.0",
    "pyarrow>=15.0.0",
    "pandas>=2.0.0",
    "sentence-transformers>=6.0.0",
]

# TrOCR specialist (handwriting OCR). Adds transformers + sentencepiece.
trocr = [
    "transformers>=5.15.1",
    "sentencepiece>=0.2.0",
    "safetensors>=0.4.0",
]

# NLLB-200 fast translation fallback. Reuses transformers + sentencepiece.
nllb = [
    "transformers>=5.15.1",
    "sentencepiece>=0.2.0",
]

# Translation quality scoring (chrF++, BLEU, etc.).
quality = [
    "sacrebleu>=2.6.0",
]


# Voice transcription extra: faster-whisper local model engine.
# openai is a base dep — no duplicate here.
transcription = [
    "faster-whisper>=1.0.0",
]

# Glossary multi-source import: optional XLSX, SQL pair-table, git archive
# fetchers, XML format support (XLIFF/TBX/TMX), and encoding auto-detection.
# Every parser tolerates the dep being missing by raising
# `FormatNotAvailableError` from `core.glossary_sources.parse`, which the
# router maps to HTTP 503 with an install hint. (defusedxml moved to the
# base deps in audit P1-8: XXE/DTD rejection must not be optional.)
glossary = [
    "openpyxl>=3.1.5",        # XLSX support (CSV/TSV use stdlib)
    "sqlalchemy>=2.0.0",       # SQL pair-table reader
    "gitpython>=3.1.0",        # Git glossary file fetcher
    "chardet>=5.2.0",          # Encoding detection fallback
]


[project.scripts]
omniscribe-server = "omniscribe.server:main"
omniscribe-migrate-lexicon = "omniscribe.cli.migrate_lexicon:main"

[project.urls]
Homepage = "https://github.com/Sifr-r/OmniScribe"
Repository = "https://github.com/Sifr-r/OmniScribe"
Issues = "https://github.com/Sifr-r/OmniScribe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omniscribe"]

[tool.hatch.build.targets.sdist]
include = [
    "src/omniscribe",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "mypy>=1.9.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "cyclonedx-bom>=7.3.1",
    "rich>=15.0.0",
    "fakeredis>=2.37.1",  # in-memory Redis for state.redis tests
    # Direct `requests` import — only `scripts/ingest_lexicon.py` needs it
    # in this repo. Runtime deps get it transitively via surya-ocr.
    "requests>=2.34.2",
    # Phase 4.4 (RFC 001 Option A): PyInstaller is the build tool for
    # the Windows server bundle (``make bundle`` / ``make bundle-smoke``).
    # Not a runtime dep — it only runs on the maintainer's machine /
    # in CI. Pinned to 6.x because the 6.20+ line is what fixed the
    # torch + surya-ocr hidden-imports dance that older 5.x builds
    # routinely botched.
    "pyinstaller>=6.20,<7",
    # Phase 5.5 (2026-09-05): re-runs flaky tests up to 2x with a 1s
    # delay before giving up. Used by ``.github/workflows/test.yml``
    # to absorb the time.sleep(0.05) flakiness the audit's QA lens
    # flagged — see Phase 3.7 in the remediation plan. The reruns are
    # a band-aid for the test-suite-quality issues that
    # Phase 5.7 ("replace magic-number sleeps") addresses; expect
    # to drop the dep once the sleep sites are gone.
    "pytest-rerunfailures>=15.0",
]

[tool.uv]
# Pillow override — keep >=11.3 for native AVIF decoding (drops the
# pillow-avif-plugin runtime dep entirely). Required because the
# current ``surya-ocr`` line still pins Pillow <11 in its resolver
# metadata, which conflicts with our other deps that need the 11.x
# API. The Pillow 10→11 changes are deprecated-API removals and
# the Python 3.8 drop, both already aligned with our
# ``requires-python >=3.11`` floor, so the override is safe in
# practice. Re-evaluate when surya-ocr publishes a release that
# drops the upper pin; bump this in lockstep.
override-dependencies = [
    "pillow>=11.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: loads Surya models (~5s first run) — skip with '-m \"not slow\"'",
    # OCR quality trust layer dataset-driven regression tests.
    "slow_dataset: opt-in dataset regression tests — run via nightly workflow",
]
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20:surya.*",
]

# OCR quality trust layer workspace defaults. Mirrors the field defaults
# on :class:`omniscribe.core.ocr_quality.config.OCrQualitySettings`; per-run
# overrides flow through the API `quality_options` body field.
[tool.omniscribe.ocr_quality]
watermark_enabled = false
watermark_aggressiveness = 0.5
script_detect_enabled = false
hallucination_enabled = false
hallucination_cross_check = false
calibration_enabled = false
trust_flag_threshold = 0.5
phase2_default = false
phase3_default = false

[tool.ruff]
line-length = 88
target-version = "py311"
# Phase E (review E.1) — the `.opencode/tmp/` directory holds
# third-party sandbox scripts (verifier outputs from past code-review
# runs, etc.) that are not part of the project source. The
# `scripts/` directory holds developer-only CLI helpers (debug
# scripts, fixture builders, visualizers) — they're not shipped,
# not imported by the package, and not part of the production
# lint surface. Excluding both means `ruff check` measures the
# code that actually reaches users, not the throwaway tooling
# that helps maintainers.
extend-exclude = [
    ".opencode/tmp/**",
    ".mavis/**",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify (ternary, match, etc.)
    "RUF", # ruff-specific rules
    "G",   # flake8-logging-format (catches f-strings in logger.*)
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard in FastAPI)
    "G004", # f-strings in logging — too noisy in this codebase's existing style
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing violations surfaced when SIM/RUF/G were enabled. Each entry
# defers the cleanup to a follow-up PR so the new rules stay active for new
# code without bundling unrelated fixes into this commit.
# SIM105 in server.py: ``except asyncio.CancelledError: pass`` reads more
# naturally than ``contextlib.suppress(...)`` when the only consumer of
# the suppressed exception is the cleanup task itself.
"src/omniscribe/server.py" = ["SIM105"]
# RUF022 in core/{ocr,grounded}/__init__.py: the public/private grouping in
# __all__ is intentional and more scannable than strict alphabetical.
"src/omniscribe/core/grounded/__init__.py" = ["RUF022"]
"src/omniscribe/core/ocr/__init__.py" = ["RUF022"]
# SIM113 in core/grounded/prompted.py: the manual `completed` counter in the
# `asyncio.as_completed` loop is intentional — we cannot use enumerate()
# because `as_completed` yields futures, not indices.
"src/omniscribe/core/grounded/prompted.py" = ["SIM113"]
# RUF001 in core/ocr/filters.py: the curly quotes in `_trim` are intentional —
# OCR can emit curly quotes that need stripping, not ASCII apostrophes.
"src/omniscribe/core/ocr/filters.py" = ["RUF001"]
"src/omniscribe/evaluation.py" = ["RUF002"]
# B904 in plugins/ocr/plugin.py: the page_range / dpi / similar form
# parsers catch ``ValueError`` from ``int(str(x))`` and re-raise as
# ``HTTPException(400, ...)``. The original ``ValueError`` carries no
# information the API caller can act on, so the cleaner intent is
# ``raise HTTPException(...) from None`` — but rewriting each site
# belongs to a follow-up PR (the audit's B904 cleanup is its own
# item). Per-file-ignore keeps CI green while the project standardizes.
"src/omniscribe/plugins/ocr/plugin.py" = ["B904"]
"tests/**/*.py" = [
    "RUF002", # × in docstring comments
    "RUF003", # × in inline comments
    "RUF005", # list concatenation in test fixture builders
    "RUF007", # pairwise() in helper loops
    "RUF012", # mutable class defaults in test stub classes
    "RUF015", # single-element slice patterns in fixture lookups
    "SIM117", # nested `with` statements in test setup
]
"scripts/**/*.py" = [
    "E402", # module level import not at top of file (after setup_sys_path())
]

[tool.coverage.run]
source = ["src/omniscribe"]
branch = true
omit = [
    "src/omniscribe/resources/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "@overload",
]
# Coverage gate: 80% (matches the CI workflow's --cov-fail-under).
# The 7b17e0a commit raised this from 80 to 85 ("C-1/C-2 reconcile
# coverage threshold"), but the codebase has sat at ~82% the whole
# time — picking 85 was aspirational rather than reachable, and the
# audit's real goal ("single source of truth that matches the
# codebase") is better served by 80. The 15 under-tested modules
# that drive the gap (core/transcription, core/grounded,
# core/lexicon, core/glossary_sources, plugins/glossary) need
# heavy fixtures (Whisper model, LLM endpoint, pyarrow, SQL) and
# are scheduled for a separate coverage-improvement wave. Bump
# back up when the total is sustainably above the new floor.
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# `core/` is the production hot path — require explicit type annotations
# on every public function and method. Adds one extra line per function
# in exchange for runtime safety and a faster mypy loop.
module = "omniscribe.core.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# `plugins/` and `harness/` are the harness and per-feature extension
# surface (audit D9). v0.3.0 brought both into mypy strict: 4 missing
# return-type annotations were added, and the 9 untyped-call sites into
# ``pymupdf`` (which ships partial stubs) are now marked with
# ``# type: ignore[no-untyped-call]`` on the lines mypy still flags.
# ``0 errors in 56 source files`` with the strict flags on.
module = ["omniscribe.plugins.*", "omniscribe.harness.*"]
disallow_untyped_defs = true
disallow_untyped_calls = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_errors = false



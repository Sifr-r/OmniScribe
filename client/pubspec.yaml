name: omniscribe_client
description: "OmniScribe Flutter Client - High Performance PDF OCR & Document Processing"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.0
  file_picker: ^12.2.0
  desktop_drop: ^0.8.4
  flutter_animate: ^4.5.0
  google_fonts: ^9.0.0
  path: ^1.9.0
  url_launcher: ^6.2.6
  intl: ^0.20.3
  collection: ^1.19.1
  riverpod: 3.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

name: Security scan

# Static security analysis on every PR + push to main.
#
# Runs Semgrep with the same registry configs used for the local scan
# (`p/default`, `p/security-audit`, `p/secrets`, `p/owasp-top-ten`).
# The config set is intentionally narrow — `p/security-audit` covers
# the OWASP-relevant sinks, `p/secrets` catches hardcoded credentials,
# and `p/owasp-top-ten` aligns with the project's stated coverage in
# `SECURITY.md`. Findings surface in the GitHub Security
# tab via the SARIF upload so the team can triage them alongside
# Dependabot and Trivy alerts (see `test.yml`'s `container-scan`).
#
# Excludes bundled frontend artifacts via `.semgrepignore` (the
# Vite-generated `index-*.js` produces recurring false positives and
# fixpoint timeouts that drown the real signal).
#
# Does not run on `nightly.yml` cadence because Semgrep registry
# rule updates ship weekly; weekly drift is acceptable for static
# pattern matching. Pair with `pip-audit` (test.yml) for SCA drift.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Sunday 02:00 UTC — picks up new registry rules between
    # weeks without burning PR cycle latency.
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege top level; the semgrep job elevates only what the
# SARIF upload needs (``security-events: write``). Without it the
# upload step silently no-ops and findings never reach the Security tab.
permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep (OSS engine)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Semgrep CLI
        timeout-minutes: 5
        # Avoid Docker Hub's anonymous pull limits during job startup.
        # Ubuntu's Python supports the same Semgrep version as the former
        # container; isolate its dependencies from the project environment.
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --timeout 30 --retries 2 \
            "semgrep==1.173.0"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        timeout-minutes: 10
        # `--error` makes the exit code non-zero on any finding so
        # the workflow fails the PR. `--sarif` emits the SARIF that
        # the next step uploads to GitHub Security.
        run: |
          timeout --verbose --kill-after=30s 8m semgrep scan \
            --config "p/default" \
            --config "p/security-audit" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --error \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            src/omniscribe

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        timeout-minutes: 3
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

name: Tests

# Fast-tier validation on every PR + push to main.
#
# Scope: runs `pytest -m "not slow and not slow_dataset"`. Skips the
# `slow` marker because those tests load Surya from HF Hub (~500MB
# download on first run); not worth the CI minutes for routine
# validation. Skips the `slow_dataset` marker because those tests
# depend on full OCR-Quality and KIE-HVQA fixtures that are
# license-gated (see `scripts/fetch_datasets.py` and the nightly
# `calibration` job). No live LLM endpoint is ever contacted in CI;
# the `live_llm` marker was removed in Wave 14.
#
# Matrix: Python 3.11 (the floor in pyproject.toml), 3.13, and 3.14
# (the Dockerfile's base image; see the F4.17 audit fix below) to
# catch version-specific regressions without quadrupling runtime.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the fast tier only reads the repo and uploads
# workflow artifacts (no extra scopes needed for either).
permissions:
  contents: read

jobs:
  fast:
    name: pytest (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # F4.17 audit fix (documented; revised 2026-09-12): the matrix
      # intentionally covers Python 3.11 (the floor in ``pyproject.toml``)
      # on both ubuntu + windows, plus 3.13 and 3.14 on ubuntu. The
      # 3.14 cell was added so the ``Dockerfile`` base
      # (``python:3.14-slim``) is exercised in CI — ``pyproject.toml``'s
      # classifier advertises 3.14 support but until 2026-09-12 nothing
      # in CI ran against it. The nightly workflow adds 3.12 to the
      # slow tier so the production window (3.12+) gets a Surya-path
      # regression run nightly; the fast tier stays at 3.11 + 3.13 + 3.14
      # (windows remains 3.11-only) so the matrix doesn't quadruple in
      # size. The fast/nightly drift is documented here so a future
      # "why doesn't nightly match test.yml?" question has the answer
      # in-tree.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.11"
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync deps (CLI + web extras)
        # F4.20 audit fix (documented): the fast tier intentionally
        # does NOT install ``--extra async-translation`` (Celery +
        # Redis + LangGraph). The async translation path is
        # exercised in the nightly workflow where a real Redis
        # container is available. The fast tier stays under
        # ~2 minutes by skipping the async extras; the nightly
        # tier catches async regressions. ``uv sync`` resolves
        # the core + web extra, which is what the fast
        # ``pytest -m "not slow"`` collection needs.
        run: uv sync --extra web

      - name: Run Ruff check
        run: uv run ruff check src tests --no-fix

      - name: Run Ruff format check
        run: uv run ruff format src tests --check

      - name: Run Mypy type check
        run: uv run mypy src tests

      - name: Run fast tests
        # --cov-fail-under matches the ``[tool.coverage] fail_under``
        # value in pyproject.toml. See the pyproject comment for why
        # the floor is 80 (the codebase is at ~82% and the 15
        # under-tested modules need heavy fixtures to bring up).
        #
        # P6 reductive audit (2026-09-09): the Phase 5.5
        # ``--reruns=2 --reruns-delay=1`` band-aid is removed. The
        # audit's five ``time.sleep`` poll sites are unchanged but
        # worked reliably in the post-removal dry run; if a flake
        # recurs here it will be visible in the JUnit XML instead
        # of being silently absorbed by a re-run.
        #
        # ``--junitxml=reports/junit.xml`` produces a machine-
        # readable test report; the next step uploads it as a
        # workflow artifact so flaky runs are inspectable in
        # the GitHub UI.
        run: uv run pytest -m "not slow and not slow_dataset" --cov=src/omniscribe --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --junitxml=reports/junit.xml -v

      - name: Upload JUnit test report
        # The workflow's per-test history; the report is the
        # same content across the matrix so the artifact is
        # matrix-free on purpose. With the pytest-rerunfailures
        # band-aid gone, any flaking test now surfaces here as
        # a failed testcase rather than a silently-rerun pass.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.python }}-${{ matrix.os }}
          path: reports/junit.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Render HTML coverage report
        # Sprint 4 / M-4 audit fix: publish an HTML coverage report
        # so developers can drill into "which line in core/pipeline.py
        # is uncovered?" without running coverage locally. The XML
        # report above is for Codecov; the HTML one is human-facing.
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run coverage html -d htmlcov

      - name: Upload HTML coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html-${{ matrix.python }}
          path: htmlcov
          retention-days: 30

      - name: Run pip-audit vulnerability check
        # 2026-10-08: AnyIO >=4.14.2 and urllib3 >=2.8.0 resolve their
        # advisories; neither dependency needs an audit exception.
        # The remaining SDK exception has the reachability proof below.
        #
        # [3] CVE-2026-104873 (langgraph-sdk, High 7.6)
        #     "resource-scoped authorization decorators @auth.on.* ignore
        #     the actions argument", allowing cross-tenant access on a
        #     LangGraph Platform server.
        #     PROOF: it is a bug in the *custom auth handler* API for
        #     people who run their own LangGraph API server. OmniScribe
        #     never imports ``langgraph_sdk`` at all — the single import
        #     site is ``core/translate/workflow.py:87``:
        #     ``from langgraph.graph import END, START, StateGraph``,
        #     i.e. the local graph-execution engine, not the server SDK.
        #     langgraph-sdk is pulled in only as a mandatory transitive
        #     dependency of ``langgraph``. Upgrading to the fix
        #     (langgraph-sdk 0.4.4+) would force ``websockets>=17.0.1``
        #     (pyproject ``[web]`` extra) down to ``<17`` — moving a
        #     production runtime dependency backwards to silence a
        #     finding that is unreachable. Deliberately declined
        #     2026-10-06.
        #
        # History: PYSEC-2026-311 / CVE-2026-45829 (chromadb) was also
        # risk-accepted here until chromadb left the dep tree in the
        # Phase 5 lexicon migration, after which the flag was dropped
        # (2026-09-06). If pip-audit flags chromadb in a local env, it
        # is a stale local install, not a declared dependency.
        #
        # Keep this list and the Makefile ``audit`` target in sync.
        run: >-
          uv run pip-audit
          --ignore-vuln CVE-2026-104873

      - name: Generate CycloneDX SBOM
        # F5-09 audit fix (revised 2026-09-12): only generate the SBOM
        # when this run is part of the release path AND is the single
        # canonical matrix cell. The original gate
        # (``github.event_name == 'push' && github.ref == 'refs/heads/main'``)
        # produced 3 byte-identical SBOMs per fast-tier push
        # (ubuntu+3.11, ubuntu+3.13, windows+3.11), with the upload step
        # silently overwriting the matrix-free artifact name. Adding the
        # matrix gate restricts generation to ubuntu + 3.13, so
        # ``release.yml`` attaches the one canonical SBOM. PRs still
        # build the project and run the test suite; they just skip the
        # SBOM.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: uv run cyclonedx-py environment --output-format json --output-file sbom.json

      - name: Upload CycloneDX SBOM artifact
        # Same gate as the generation step. The artifact name is
        # matrix-free because the matrix gate above restricts
        # the upload to the single canonical cell (ubuntu + 3.13).
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx.json
          path: sbom.json
          if-no-files-found: ignore

  # Audit M2: build the production Dockerfile and scan the resulting image
  # for HIGH/CRITICAL CVEs. Findings surface in the GitHub Security tab
  # via the SARIF upload (the "trivy" category), so the team can triage
  # container CVEs alongside the Dependabot and Semgrep alerts that
  # `security.yml` already produces. No paid scanner: this is Trivy OSS
  # against the public GHSA / NVD feeds, no API key required.
  #
  # Independent of `fast` -- Docker build + image scan is slow and would
  # otherwise lengthen the pytest matrix. Runs in parallel; both jobs
  # must pass for the workflow to be green.
  container-scan:
    name: container scan (trivy OSS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ``security-events: write`` is required so the SARIF upload
      # actually lands in the Security tab; without it the upload
      # silently no-ops. Same pattern as the Semgrep job in
      # `security.yml`.
      security-events: write
    steps:
      # Action refs are SHA-pinned (audit P3-12 / P2-15); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`. The
      # docker/* and aquasecurity/trivy-action pins below are part of
      # that same contract; the trailing `# v3` / `# v6` / `# 0.28.0`
      # comments are the human-readable tag the SHA resolves to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image (load into local daemon for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # `load: true` puts the built image into the runner's local
          # Docker daemon so the follow-up `trivy image` step can scan
          # it. `push: false` keeps the image off any registry -- this
          # is a CI scan, not a publish.
          load: true
          push: false
          tags: omniscribe:scan
          # GHA build cache (audit P2-4: cache layers across runs to
          # keep build + scan under a couple of minutes once warm).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: omniscribe:scan
          # 2026-09-13 audit: trivy-action v0.36.0 bundles Trivy CLI v0.70.0
          # by default. The latest Trivy CLI release is v0.74.0, so we pin
          # the CLI here. The action release train hasn't caught up
          # (v0.36.0 from April 2026 is still the latest action tag), so
          # this is the only way to track CLI upstream until a new
          # action release lands. Drop the `version` line when a newer
          # action tag ships — the CLI will track automatically.
          version: v0.74.0
          format: sarif
          output: trivy-results.sarif
          # Fail the build on any unfixed HIGH/CRITICAL -- a vuln with
          # no upstream patch can still be acceptable if the vector is
          # unreachable, but that's a per-CVE decision best made in a
          # Security-tab triage, not silently ignored in CI.
          severity: HIGH,CRITICAL
          # SARIF defaults to all severities unless this action input is set.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          # One expiring, package-scoped SDK exception with reachability proof.
          # All other fixable HIGH/CRITICAL findings still fail this job.
          trivyignores: .trivyignore.yaml
          # GITHUB_TOKEN is auto-injected; using it raises the GHSA
          # rate limit so the public-feed path doesn't 429 on PR
          # bursts. Not a "secret" in the audit's sense (audit M2
          # forbids paid scanner keys, not the runner's own token).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  client-tests:
    name: flutter (analyze + test + boundary gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: stable
          cache: true

      - name: Install client dependencies
        run: cd client && flutter pub get

      # Feature ownership and JSON contracts were documentation-only checks:
      # nothing ran them, so a feature could start importing another feature's
      # internals or drift from the server contract without failing any job.
      # The layout check is stdlib-only, so the runner's python3 is enough.
      - name: Check client feature ownership and import boundaries
        run: python3 client/tool/check_feature_layout.py

      # --enable-asserts is required, not optional: the contract tool asserts,
      # and without the flag every assertion is compiled out so the script
      # prints "passed" and exits 0 even when a contract is violated.
      - name: Check client feature JSON contracts
        run: cd client && dart --enable-asserts tool/check_feature_contracts.dart

      - name: Analyze client code
        run: cd client && flutter analyze --fatal-infos

      - name: Run client tests
        run: cd client && flutter test

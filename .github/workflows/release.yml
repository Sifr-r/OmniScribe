name: Release

# Auto-release driven by `version` in pyproject.toml.
#
# Flow:
#   1. PR author bumps `version = "..."` in pyproject.toml as part of their PR.
#   2. PR is reviewed + merged to main.
#   3. This workflow fires (push to main with pyproject.toml in the diff).
#   4. If the version doesn't already have a matching tag, the job:
#       a. builds the wheel + sdist (so a broken build never produces a tag),
#       b. refreshes any @vX.Y.Z pin example present in README.md,
#       c. pushes a README commit when that replacement changes the file,
#       d. tags v<version>,
#       e. creates a GitHub release with auto-generated notes and the wheel
#          attached so users can `uv tool install <release-asset-url>` directly.
#
# `workflow_dispatch` is kept as a manual override for retries / edge cases
# (e.g., re-running after a transient network failure during release upload).

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Action refs are SHA-pinned (audit P3-12); bump with
      # `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # F5-08 audit fix: this workflow runs with
          # ``permissions: contents: write`` and pushes back to ``main``
          # (README-pin commit + tag). On a branch-protected ``main``,
          # the default ``GITHUB_TOKEN`` is rejected by the protection
          # rule — the recommended posture is to set up a dedicated
          # "Release" GitHub App with branch-protection bypass rules
          # scoped to the auto-generated ``github-actions[bot]``
          # author, OR provide a fine-grained PAT via a release-only
          # secret. The README's "Branch protection" section links to
          # the upstream docs for both options. With no protection
          # rule the default GITHUB_TOKEN works as-is.

      - name: Read version + check tag uniqueness
        id: ver
        run: |
          VER=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          if [[ -z "$VER" ]]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]*)?$ ]]; then
            echo "::error::Version '$VER' is not PEP 440 (e.g. 0.2.0 or 1.0.0a1)"
            exit 1
          fi
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "Tag v$VER already exists - no new release needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VER..."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.ver.outputs.skip != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Build wheel + sdist
        if: steps.ver.outputs.skip != 'true'
        # P5 reductive audit: the sample-PDF fixtures are sourced from
        # ``tests/fixtures/pdfs/`` (canonical) and copied to
        # ``src/omniscribe/resources/sample_pdfs/`` (wheel payload)
        # by the autouse session fixture in ``tests/conftest.py``
        # during ``uv build``'s PEP 517 build-system discovery —
        # but only if the destination is empty, which it will be on
        # a fresh CI checkout. The explicit cp here is belt-and-
        # braces so the wheel ships the fixtures even if the test
        # suite is skipped in a future workflow change.
        run: |
          mkdir -p src/omniscribe/resources/sample_pdfs
          cp tests/fixtures/pdfs/*.pdf src/omniscribe/resources/sample_pdfs/
          uv build

      - name: Update README pin example
        if: steps.ver.outputs.skip != 'true'
        run: |
          sed -i -E "s|OmniScribe\\.git@v[0-9]+\\.[0-9]+\\.[0-9]+([a-z0-9.-]*)?|OmniScribe.git@${{ steps.ver.outputs.tag }}|g" README.md
          grep -nE 'OmniScribe\\.git@v' README.md || true

      - name: Commit README (if changed), tag, push
        if: steps.ver.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # README pin only needs a commit if it actually changed (i.e., the
          # last release wasn't already pinned to this version somehow).
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: pin install example to ${{ steps.ver.outputs.tag }}"
            git push origin main
          fi

          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub release with built artifacts
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

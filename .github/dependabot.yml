version: 2
updates:
  # The project is installed with uv, not pip: Dockerfile runs
  # `uv sync --locked` against the committed uv.lock, and pyproject.toml
  # carries a [tool.uv] section. Declaring "pip" here made Dependabot edit
  # only pyproject.toml and never regenerate uv.lock, so every pip bump
  # shipped permanent lockfile drift and broke `uv sync --locked` during the
  # container build -- which failed the Trivy container scan before it could
  # scan anything. The "uv" ecosystem updates uv.lock alongside the manifest.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Flutter client dependencies live in client/pubspec.yaml.
  - package-ecosystem: "pub"
    directory: "/client"
    schedule:
      interval: "weekly"

  # F5-24 audit fix: github-actions bumps are far less frequent than
  # the underlying action releases — most workflow pinning is by
  # SHA, so a Dependabot "weekly" churns PRs without producing
  # meaningful diffs. Monthly keeps the dependency-fresh signal
  # without spamming reviewers.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Dockerfile + compose.yaml base images (audit P1-7).
  # F5-24 audit fix: same rationale as github-actions — the base
  # image is also digest-pinned at the Dockerfile level, so a
  # version-bump Dependabot is informational. Monthly cadence
  # keeps the signal without the noise.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
